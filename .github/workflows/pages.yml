name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores públicos por desenho (a proteção dos dados é a RLS do Supabase).
      NEXT_PUBLIC_SUPABASE_URL: https://yifxgiwmibjaornighvt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xHjsFJbSuAhO6r6BUylTCw_tDE-nFXT
      # Client ID da app Azure (público por desenho). Definir em Settings → Variables → Actions: MS_CLIENT_ID
      NEXT_PUBLIC_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
